[project]
name = "transcribe"
version = "0.1.0"
description = "Transcribe audio with Voxtral Mini Transcribe 3, orchestrated with LangChain and LangGraph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "langchain-core>=0.3",
    "langchain-mistralai>=0.2",
    "langgraph>=0.4",
    "langgraph-checkpoint-sqlite>=2.0",
    "pydantic>=2",
]

[project.scripts]
transcribe = "transcribe.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcribe"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Reference client and tests are kept verbatim from the implementation guide.
extend-exclude = ["src/transcribe/voxtral_client.py", "tests/test_voxtral_client.py"]
